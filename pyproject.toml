[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foliant-protocol"
version = "0.1.3"
description = "Foliant reference implementation: agent accounts with hierarchical spending policies, payment channels, pooled settlement and HTTP 402 metering in the x402 wire format"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://foliant.network"
Source = "https://github.com/gazoy/concord"

[tool.setuptools]
packages = ["foliant"]

[tool.setuptools.package-data]
foliant = ["abi/*.json"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
# major-version ceilings: foliant/chain.py reasons about web3 7's exception types, its
# raw_transaction attribute and its retry allowlist, so a major bump needs the suites re-run
chain = ["web3>=7,<8", "eth-account>=0.13,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient", "ignore:.*httpx2.*"]
