[project]
name = "concord-ref"
version = "0.1.0"
description = "Concord agent-layer reference implementation: accounts, policies, channels, pools, HTTP 402 metering"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "fastapi>=0.110", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient", "ignore:.*httpx2.*"]
