[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# SpecVectors.t.sol's _run loop walks every vector in docs/spec/vectors.json and parses its
# kind, in all five tests, so each vector added anywhere costs gas in every one of them. The
# 2**30 default was already about 80% consumed at 115 vectors and 157 took test_tree_vectors
# over it (CI run 36886033594). 2**35 is ~32x headroom. Both limits are raised because the
# experiment that confirmed the fix (CI on branch ci/prove-gas-limit at 157 vectors) set both;
# which one alone would have sufficed was not established.
gas_limit = 34359738368
block_gas_limit = 34359738368
fuzz = { runs = 512 }
invariant = { runs = 64, depth = 32, fail_on_revert = false }
fs_permissions = [{ access = "read", path = "../docs/spec" }]

# this build environment cannot download solc; it uses a release binary at a fixed path
[profile.session]
solc = "/usr/local/bin/solc-0.8.30"

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
avalanche = "https://api.avax.network/ext/bc/C/rpc"
