[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fuzz = { runs = 512 }
invariant = { runs = 64, depth = 32, fail_on_revert = false }
fs_permissions = [{ access = "read", path = "../docs/spec" }]

# this build environment cannot download solc; it uses a release binary at a fixed path
[profile.session]
solc = "/usr/local/bin/solc-0.8.30"

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
avalanche = "https://api.avax.network/ext/bc/C/rpc"
