[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# SpecVectors.t.sol parses the whole of docs/spec/vectors.json in every test, so each added
# vector costs gas in all of them. At 115 vectors that test already uses ~80% of forge's
# 2**30 default, and 157 vectors took it over (CI run 36886033594). 2**35 is ~32x headroom.
gas_limit = 34359738368
block_gas_limit = 34359738368
fuzz = { runs = 512 }
invariant = { runs = 64, depth = 32, fail_on_revert = false }
fs_permissions = [{ access = "read", path = "../docs/spec" }]

# this build environment cannot download solc; it uses a release binary at a fixed path
[profile.session]
solc = "/usr/local/bin/solc-0.8.30"

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
avalanche = "https://api.avax.network/ext/bc/C/rpc"
