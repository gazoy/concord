# nginx site for the Foliant demo. Copy to /etc/nginx/sites-available/fuji.foliant.network,
# symlink into sites-enabled, then let certbot add the TLS block:
#   sudo certbot --nginx -d fuji.foliant.network
server {
    listen 80;
    listen [::]:80;
    server_name fuji.foliant.network;

    access_log /var/log/nginx/foliant-access.log;
    error_log  /var/log/nginx/foliant-error.log;

    # a visitor may send X-Forwarded-For themselves; replacing it (rather than appending with
    # $proxy_add_x_forwarded_for) means the header the app reads is exactly the peer we saw, so the
    # tap's per-client limit cannot be slipped with a forged header (TAP-AUDIT-FINAL-2 XY-1)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # a tap request waits for two receipts on Fuji; the usual 60 s read timeout would hand the
    # visitor a 504 while they were being funded, spending their one attempt (demo/serve_chain.py)
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    client_max_body_size 8k;   # the app refuses anything over 1 KiB itself; this is the cheap outer bound

    location / {
        proxy_pass http://127.0.0.1:8402;
    }
}
